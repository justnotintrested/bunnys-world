<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bucket List — Bunny's World</title>
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pixel.css" />
  <style>
    body { padding-top: 5rem; }

    .page-hero {
      text-align: center;
      padding: 4rem 2rem 3rem;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, #1c0a08, var(--ink) 70%);
    }
    .page-hero h1 { font-size: clamp(2.5rem, 7vw, 5rem); color: var(--gold); }
    .page-hero p  { font-style: italic; color: var(--mist); margin-top: 0.5rem; }

    /* Stats bar */
    .stats-bar {
      display: flex; justify-content: center; gap: 3rem;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(201,168,76,0.1);
      background: rgba(201,168,76,0.02);
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: var(--ff-disp); font-size: 2rem;
      color: var(--gold); display: block;
    }
    .stat-label {
      font-size: 0.6rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--mist); opacity: 0.6;
    }

    /* Add item form */
    .add-form {
      max-width: 800px; margin: 2rem auto; padding: 0 1.5rem;
      display: flex; gap: 0.8rem; flex-wrap: wrap;
    }
    .add-form input {
      flex: 1; min-width: 200px;
    }
    .add-form select { width: auto; flex: 0 0 160px; }

    /* Category tabs */
    .cat-tabs {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      padding: 0 1.5rem; max-width: 800px; margin: 0 auto 2rem;
    }
    .cat-tab {
      padding: 0.35rem 1rem;
      font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
      border: 1px solid rgba(201,168,76,0.2); border-radius: 20px;
      background: transparent; color: var(--mist);
      cursor: pointer; transition: all var(--transition);
    }
    .cat-tab.active, .cat-tab:hover {
      background: rgba(201,168,76,0.1);
      border-color: var(--gold); color: var(--gold);
    }

    /* List */
    .list-wrap {
      max-width: 800px; margin: 0 auto; padding: 0 1.5rem 5rem;
    }

    .category-group { margin-bottom: 3rem; }
    .category-heading {
      font-size: 0.62rem; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--gold);
      opacity: 0.55; margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(201,168,76,0.1);
    }

    .bucket-item {
      display: flex; align-items: flex-start; gap: 1rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: opacity 0.3s;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .bucket-item.done { opacity: 0.45; }
    .bucket-item.done .item-text { text-decoration: line-through; }

    .item-check {
      width: 20px; height: 20px; flex-shrink: 0;
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 2px;
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; margin-top: 0.15rem;
    }
    .item-check:hover { border-color: var(--gold); background: rgba(201,168,76,0.1); }
    .item-check.checked {
      background: var(--gold); border-color: var(--gold);
    }
    .item-check.checked::after {
      content: '✓'; color: var(--ink); font-size: 0.75rem; font-weight: bold;
    }

    .item-body { flex: 1; }
    .item-text {
      font-size: 1rem; color: var(--cream); line-height: 1.5;
    }
    .item-note {
      font-size: 0.78rem; color: var(--mist); opacity: 0.6;
      margin-top: 0.2rem; font-style: italic;
    }
    .item-cat-badge {
      display: inline-block;
      font-size: 0.55rem; letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 10px; color: var(--gold); opacity: 0.7;
      margin-top: 0.3rem;
    }

    .item-actions {
      display: flex; gap: 0.4rem; opacity: 0;
      transition: opacity 0.2s; flex-shrink: 0;
    }
    .bucket-item:hover .item-actions { opacity: 1; }
    .item-btn {
      background: transparent; border: none; cursor: pointer;
      color: var(--mist); font-size: 0.75rem; padding: 0.2rem 0.4rem;
      border-radius: 2px; transition: color 0.2s;
    }
    .item-btn:hover { color: var(--gold); }
    .item-btn.del:hover { color: var(--rose); }

    .empty-state {
      text-align: center; padding: 4rem 2rem;
      font-style: italic; color: var(--mist); opacity: 0.4;
    }

    .loading-state {
      text-align: center; padding: 3rem;
      font-size: 0.7rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--mist); opacity: 0.4;
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="nav-logo">Bunny's World</a>
    <ul class="nav-links">
      <li><a href="her-world.html">Her World</a></li>
      <li><a href="trackers.html">Trackers</a></li>
      <li><a href="cancer-corner.html">Cancer Corner</a></li>
      <li><a href="ginju.html">Ginju</a></li>
    </ul>
  </nav>

  <div class="page-hero">
    <p class="caps mist" style="font-size:0.6rem;margin-bottom:1rem;opacity:0.5;">Her World</p>
    <h1>Bucket List</h1>
    <p>Things to do, places to go, moments to collect.</p>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="stat-total">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-done">0</span>
      <span class="stat-label">Done ✓</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-left">0</span>
      <span class="stat-label">To go</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-pct" style="color:var(--rose)">0%</span>
      <span class="stat-label">Complete</span>
    </div>
  </div>

  <!-- Add form -->
  <div class="add-form">
    <input class="input" id="new-item" type="text" placeholder="Add something to your list…" />
    <select class="select" id="new-cat">
      <option value="Travel">✈ Travel</option>
      <option value="Experience">✨ Experience</option>
      <option value="Creative">🎨 Creative</option>
      <option value="Personal">🌱 Personal</option>
      <option value="Fashion">👗 Fashion</option>
      <option value="Food">🍜 Food</option>
      <option value="Books">📚 Books</option>
      <option value="Other">◆ Other</option>
    </select>
    <button class="btn btn-gold" id="add-btn">Add ◆</button>
  </div>

  <!-- Category filter tabs -->
  <div class="cat-tabs">
    <button class="cat-tab active" data-filter="All">All</button>
    <button class="cat-tab" data-filter="Travel">Travel</button>
    <button class="cat-tab" data-filter="Experience">Experience</button>
    <button class="cat-tab" data-filter="Creative">Creative</button>
    <button class="cat-tab" data-filter="Personal">Personal</button>
    <button class="cat-tab" data-filter="Fashion">Fashion</button>
    <button class="cat-tab" data-filter="Food">Food</button>
    <button class="cat-tab" data-filter="Books">Books</button>
    <button class="cat-tab" data-filter="Other">Other</button>
    <button class="cat-tab" data-filter="done">✓ Done</button>
  </div>

  <!-- List -->
  <div class="list-wrap">
    <div id="list-container">
      <div class="loading-state">Loading your list…</div>
    </div>
  </div>

  <script type="module">
    import { initGate } from './js/gate.js';
    import { db, ref, push, onValue, update, remove } from './js/firebase-config.js';

    initGate();

    const DB_PATH = 'bucket_list';
    let items = {};
    let activeFilter = 'All';

    // ── Firebase listeners ──────────────────────────────────────
    const listRef = ref(db, DB_PATH);
    onValue(listRef, snap => {
      items = snap.val() || {};
      render();
      updateStats();
    });

    // ── Add item ────────────────────────────────────────────────
    document.getElementById('add-btn').addEventListener('click', addItem);
    document.getElementById('new-item').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    function addItem() {
      const text = document.getElementById('new-item').value.trim();
      const cat  = document.getElementById('new-cat').value;
      if (!text) return;
      push(ref(db, DB_PATH), {
        text, cat, done: false,
        createdAt: Date.now()
      });
      document.getElementById('new-item').value = '';
    }

    // ── Toggle done ──────────────────────────────────────────────
    function toggleDone(key, current) {
      update(ref(db, `${DB_PATH}/${key}`), { done: !current });
    }

    // ── Delete ───────────────────────────────────────────────────
    function deleteItem(key) {
      if (confirm('Remove this item?')) remove(ref(db, `${DB_PATH}/${key}`));
    }

    // ── Filter tabs ──────────────────────────────────────────────
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeFilter = tab.dataset.filter;
        render();
      });
    });

    // ── Render ───────────────────────────────────────────────────
    function render() {
      const container = document.getElementById('list-container');
      const entries = Object.entries(items);

      let filtered = entries;
      if (activeFilter === 'done') {
        filtered = entries.filter(([,v]) => v.done);
      } else if (activeFilter !== 'All') {
        filtered = entries.filter(([,v]) => v.cat === activeFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">Nothing here yet — add something ✦</div>`;
        return;
      }

      // Group by category
      if (activeFilter === 'All' || activeFilter === 'done') {
        const groups = {};
        filtered.forEach(([key, val]) => {
          const g = val.done ? '✓ Completed' : (val.cat || 'Other');
          if (!groups[g]) groups[g] = [];
          groups[g].push([key, val]);
        });

        container.innerHTML = Object.entries(groups).map(([cat, groupItems]) => `
          <div class="category-group">
            <p class="category-heading">${cat}</p>
            ${groupItems.map(([key, val]) => itemHTML(key, val)).join('')}
          </div>
        `).join('');
      } else {
        container.innerHTML = filtered.map(([key, val]) => itemHTML(key, val)).join('');
      }

      // Attach events
      container.querySelectorAll('.item-check').forEach(el => {
        el.addEventListener('click', () => toggleDone(el.dataset.key, el.dataset.done === 'true'));
      });
      container.querySelectorAll('.item-del').forEach(el => {
        el.addEventListener('click', () => deleteItem(el.dataset.key));
      });
    }

    function itemHTML(key, val) {
      return `
        <div class="bucket-item ${val.done ? 'done' : ''}">
          <div class="item-check ${val.done ? 'checked' : ''}"
               data-key="${key}" data-done="${val.done}"></div>
          <div class="item-body">
            <p class="item-text">${escHtml(val.text)}</p>
            <span class="item-cat-badge">${val.cat || 'Other'}</span>
          </div>
          <div class="item-actions">
            <button class="item-btn del item-del" data-key="${key}" title="Remove">✕</button>
          </div>
        </div>`;
    }

    function updateStats() {
      const entries = Object.values(items);
      const total = entries.length;
      const done  = entries.filter(v => v.done).length;
      const left  = total - done;
      const pct   = total ? Math.round((done/total)*100) : 0;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-done').textContent  = done;
      document.getElementById('stat-left').textContent  = left;
      document.getElementById('stat-pct').textContent   = pct + '%';
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
  <script type="module">
    import { initPlayer } from './js/player.js';
    initPlayer();
  </script>
  <script type="module">
    import { initScene } from './js/scene3d.js';
    initScene();
  </script>
  <script type="module">
    import { initPixelate } from './js/pixelate.js';
    initPixelate();
  </script>
</body>
</html>
