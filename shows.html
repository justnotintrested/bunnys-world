<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shows & Movies — Bunny's World</title>
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pixel.css" />
  <style>
    body { padding-top: 5rem; }

    .page-hero {
      text-align: center;
      padding: 4rem 2rem 3rem;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, #080a10, var(--ink) 70%);
    }
    .page-hero h1 { font-size: clamp(2.5rem, 7vw, 5rem); color: var(--gold); }
    .page-hero p  { font-style: italic; color: var(--mist); margin-top: 0.5rem; }

    /* Type toggle */
    .type-toggle {
      display: flex; justify-content: center; gap: 1rem;
      margin: 2rem auto 0; padding: 0 1.5rem;
    }
    .type-btn {
      padding: 0.4rem 1.5rem;
      font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid rgba(201,168,76,0.2); border-radius: 20px;
      background: transparent; color: var(--mist); cursor: pointer;
      transition: all 0.2s;
    }
    .type-btn.active, .type-btn:hover {
      background: rgba(201,168,76,0.1); border-color: var(--gold); color: var(--gold);
    }

    /* Shelf tabs */
    .shelf-tabs {
      display: flex; gap: 0; max-width: 900px;
      margin: 1.5rem auto 0; padding: 0 1.5rem;
      border-bottom: 1px solid rgba(201,168,76,0.1);
    }
    .shelf-tab {
      padding: 0.6rem 1.4rem;
      font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--mist); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      background: transparent; border-top: none; border-left: none; border-right: none;
      transition: all 0.2s;
    }
    .shelf-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .shelf-tab:hover:not(.active) { color: var(--cream); }
    .shelf-tab .count {
      display: inline-block;
      background: rgba(201,168,76,0.15); color: var(--gold);
      border-radius: 10px; font-size: 0.5rem;
      padding: 0.05rem 0.4rem; margin-left: 0.4rem; vertical-align: middle;
    }

    /* Add form */
    .add-form {
      max-width: 900px; margin: 1.8rem auto; padding: 0 1.5rem;
      display: flex; gap: 0.8rem; flex-wrap: wrap;
    }
    .add-form input { flex: 1; min-width: 200px; }
    .add-form select { flex: 0 0 160px; }

    /* Show grid */
    .shows-wrap { max-width: 900px; margin: 0 auto; padding: 0 1.5rem 5rem; }

    .shows-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .show-card {
      background: rgba(201,168,76,0.02);
      border: 1px solid rgba(201,168,76,0.1);
      border-radius: var(--radius);
      padding: 1.2rem 1rem;
      position: relative;
      transition: all 0.25s;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .show-card:hover { border-color: rgba(201,168,76,0.25); background: rgba(201,168,76,0.05); }
    .show-card:hover .show-actions { opacity: 1; }

    .show-type-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); opacity: 0.4;
      display: inline-block; margin-bottom: 0.8rem;
    }
    .show-type-dot.movie { background: var(--rose); }

    .show-title {
      font-family: var(--ff-disp); font-size: 0.95rem;
      color: var(--cream); line-height: 1.3; margin-bottom: 0.3rem;
    }
    .show-genre {
      font-size: 0.65rem; color: var(--mist); opacity: 0.5;
      font-style: italic; margin-bottom: 0.6rem;
    }
    .show-stars { display: flex; gap: 2px; margin-bottom: 0.5rem; }
    .star {
      font-size: 0.75rem; cursor: pointer;
      color: rgba(201,168,76,0.25); transition: color 0.15s;
    }
    .star.lit { color: var(--gold); }
    .show-badge {
      display: inline-block;
      font-size: 0.5rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.1rem 0.45rem;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 10px; color: var(--gold); opacity: 0.6;
    }
    .show-badge.watching { border-color: rgba(201,168,76,0.4); opacity: 0.9; }

    .show-note {
      margin-top: 0.5rem; font-size: 0.7rem;
      color: var(--mist); opacity: 0.5; font-style: italic;
    }

    .show-actions {
      position: absolute; top: 0.6rem; right: 0.6rem;
      display: flex; gap: 0.3rem;
      opacity: 0; transition: opacity 0.2s;
    }
    .sh-btn {
      background: transparent; border: none;
      color: var(--mist); font-size: 0.65rem;
      cursor: pointer; padding: 0.15rem 0.3rem;
      border-radius: 2px; transition: color 0.2s;
    }
    .sh-btn:hover { color: var(--gold); }
    .sh-btn.del:hover { color: var(--rose); }

    .shows-empty {
      padding: 3rem; text-align: center;
      font-style: italic; color: var(--mist); opacity: 0.35;
    }

    .section-heading {
      font-size: 0.58rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--gold);
      opacity: 0.45; margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(201,168,76,0.08);
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="nav-logo">Bunny's World</a>
    <ul class="nav-links">
      <li><a href="her-world.html">Her World</a></li>
      <li><a href="trackers.html">Trackers</a></li>
      <li><a href="cancer-corner.html">Cancer Corner</a></li>
      <li><a href="ginju.html">Ginju</a></li>
    </ul>
  </nav>

  <div class="page-hero">
    <p class="caps mist" style="font-size:0.6rem;margin-bottom:1rem;opacity:0.5;">Her World</p>
    <h1>Shows & Movies</h1>
    <p>the stories that stayed with her.</p>
  </div>

  <!-- Type toggle -->
  <div class="type-toggle">
    <button class="type-btn active" data-type="all">All</button>
    <button class="type-btn" data-type="show">Series</button>
    <button class="type-btn" data-type="movie">Movies</button>
  </div>

  <!-- Shelf tabs -->
  <div class="shelf-tabs">
    <button class="shelf-tab active" data-shelf="all">All <span class="count" id="cnt-all">0</span></button>
    <button class="shelf-tab" data-shelf="watching">Watching <span class="count" id="cnt-watching">0</span></button>
    <button class="shelf-tab" data-shelf="finished">Finished <span class="count" id="cnt-finished">0</span></button>
    <button class="shelf-tab" data-shelf="want">Want to Watch <span class="count" id="cnt-want">0</span></button>
  </div>

  <!-- Add form -->
  <div class="add-form">
    <input class="input" id="new-title" type="text" placeholder="Title…" />
    <input class="input" id="new-genre" type="text" placeholder="Genre (optional)" style="flex:0 0 160px;" />
    <select class="select" id="new-type" style="flex:0 0 120px;">
      <option value="show">Series</option>
      <option value="movie">Movie</option>
    </select>
    <select class="select" id="new-shelf" style="flex:0 0 160px;">
      <option value="want">Want to Watch</option>
      <option value="watching">Watching</option>
      <option value="finished">Finished</option>
    </select>
    <button class="btn btn-gold" id="add-btn">Add ◆</button>
  </div>

  <!-- Shows -->
  <div class="shows-wrap">
    <div id="shows-container">
      <div class="shows-empty">Loading…</div>
    </div>
  </div>

  <script type="module">
    import { initGate } from './js/gate.js';
    import { db, ref, push, onValue, update, remove } from './js/firebase-config.js';

    initGate();

    const DB_PATH = 'shows';
    let shows = {};
    let activeType = 'all';
    let activeShelf = 'all';

    onValue(ref(db, DB_PATH), snap => {
      shows = snap.val() || {};
      render();
      updateCounts();
    });

    // ── Add ──────────────────────────────────────────────────────────
    document.getElementById('add-btn').addEventListener('click', addShow);
    document.getElementById('new-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') addShow();
    });

    function addShow() {
      const title = document.getElementById('new-title').value.trim();
      const genre = document.getElementById('new-genre').value.trim();
      const type  = document.getElementById('new-type').value;
      const shelf = document.getElementById('new-shelf').value;
      if (!title) return;
      push(ref(db, DB_PATH), { title, genre, type, shelf, rating: 0, createdAt: Date.now() });
      document.getElementById('new-title').value = '';
      document.getElementById('new-genre').value = '';
    }

    // ── Tabs ─────────────────────────────────────────────────────────
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.type;
        render();
      });
    });
    document.querySelectorAll('.shelf-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.shelf-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeShelf = tab.dataset.shelf;
        render();
      });
    });

    // ── Render ───────────────────────────────────────────────────────
    function render() {
      const container = document.getElementById('shows-container');
      let entries = Object.entries(shows);

      if (activeType !== 'all') entries = entries.filter(([,v]) => v.type === activeType);
      if (activeShelf !== 'all') entries = entries.filter(([,v]) => v.shelf === activeShelf);

      if (entries.length === 0) {
        container.innerHTML = `<div class="shows-empty">Nothing here yet — add something ✦</div>`;
        return;
      }

      if (activeShelf === 'all') {
        const order = ['watching','finished','want'];
        const labels = { watching:'Watching Now', finished:'Finished', want:'Want to Watch' };
        const groups = {};
        entries.forEach(([k,v]) => {
          if (!groups[v.shelf]) groups[v.shelf] = [];
          groups[v.shelf].push([k,v]);
        });
        container.innerHTML = order.filter(s => groups[s]).map(s => `
          <p class="section-heading">${labels[s]}</p>
          <div class="shows-grid">${groups[s].map(([k,v]) => showHTML(k,v)).join('')}</div>
        `).join('');
      } else {
        container.innerHTML = `<div class="shows-grid">${entries.map(([k,v]) => showHTML(k,v)).join('')}</div>`;
      }

      // Events
      container.querySelectorAll('.star').forEach(star => {
        star.addEventListener('click', () => {
          const key = star.dataset.key;
          const val = parseInt(star.dataset.val);
          const current = shows[key]?.rating || 0;
          update(ref(db, `${DB_PATH}/${key}`), { rating: current === val ? 0 : val });
        });
      });
      container.querySelectorAll('.move-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          update(ref(db, `${DB_PATH}/${btn.dataset.key}`), { shelf: btn.dataset.shelf });
        });
      });
      container.querySelectorAll('.sh-del').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm('Remove this?')) remove(ref(db, `${DB_PATH}/${btn.dataset.key}`));
        });
      });
    }

    function showHTML(key, v) {
      const stars = [1,2,3,4,5].map(n =>
        `<span class="star ${(v.rating||0) >= n ? 'lit' : ''}" data-key="${key}" data-val="${n}">★</span>`
      ).join('');

      const badgeLabel = { watching:'Watching', finished:'Finished', want:'Want' };
      const badgeClass = v.shelf === 'watching' ? 'watching' : '';

      const moves = {
        want: [['watching','→ Watching'],['finished','Mark Done']],
        watching: [['finished','Mark Done'],['want','← Want']],
        finished: [['watching','Re-watch'],['want','← Want']],
      }[v.shelf] || [];

      return `
        <div class="show-card">
          <div class="show-actions">
            ${moves.map(([s,l]) => `<button class="sh-btn move-btn" data-key="${key}" data-shelf="${s}" title="${l}">→</button>`).join('')}
            <button class="sh-btn del sh-del" data-key="${key}">✕</button>
          </div>
          <span class="show-type-dot ${v.type === 'movie' ? 'movie' : ''}"></span>
          <div class="show-title">${escHtml(v.title)}</div>
          ${v.genre ? `<div class="show-genre">${escHtml(v.genre)}</div>` : ''}
          <div class="show-stars">${stars}</div>
          <span class="show-badge ${badgeClass}">${badgeLabel[v.shelf]||v.shelf} · ${v.type==='movie'?'Film':'Series'}</span>
        </div>`;
    }

    function updateCounts() {
      const all = Object.values(shows);
      document.getElementById('cnt-all').textContent      = all.length;
      document.getElementById('cnt-watching').textContent = all.filter(s=>s.shelf==='watching').length;
      document.getElementById('cnt-finished').textContent = all.filter(s=>s.shelf==='finished').length;
      document.getElementById('cnt-want').textContent     = all.filter(s=>s.shelf==='want').length;
    }

    function escHtml(s='') {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
  <script type="module">
    import { initPlayer } from './js/player.js';
    initPlayer();
  </script>
  <script type="module">
    import { initScene } from './js/scene3d.js';
    initScene();
  </script>
  <script type="module">
    import { initPixelate } from './js/pixelate.js';
    initPixelate();
  </script>
</body>
</html>
