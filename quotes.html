<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotes Vault — Bunny's World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pixel.css" />
  <style>
    :root { --ink:#0d0908; --gold:#c9a84c; --cream:#f0e8e0; --mist:#a08060; }
    body { background:var(--ink); color:var(--cream); font-family:'Cormorant Garamond',serif; min-height:100vh; }
    .page-wrap { max-width:760px; margin:0 auto; padding:2rem 1.5rem 5rem; }
    h1 { font-family:'Bodoni Moda',serif; font-size:2rem; color:var(--gold); margin-bottom:.15rem; }
    .subtitle { font-style:italic; color:var(--mist); margin-bottom:2rem; font-size:.95rem; }

    /* Quote of the day */
    .qotd {
      background: radial-gradient(ellipse 80% 100% at 50% 0%, #1a1006, #110b07);
      border:1px solid rgba(201,168,76,.25); border-radius:10px;
      padding:2.5rem 2rem; margin-bottom:2.5rem; text-align:center;
      position:relative;
    }
    .qotd::before {
      content:'❝'; position:absolute; top:.8rem; left:1.4rem;
      font-size:2.5rem; color:var(--gold); opacity:.18; font-family:'Bodoni Moda',serif;
    }
    .qotd-label { font-size:.6rem; letter-spacing:.25em; text-transform:uppercase; color:var(--gold); opacity:.5; margin-bottom:1.2rem; }
    .qotd-text { font-size:1.35rem; font-style:italic; line-height:1.8; color:var(--cream); max-width:560px; margin:0 auto .8rem; }
    .qotd-source { font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mist); opacity:.6; }
    .qotd-empty { font-style:italic; color:#4a3a2a; padding:1rem 0; }

    /* Add form */
    .add-form { background:#110b07; border:1px solid #2a1a10; border-radius:8px; padding:1.2rem 1.5rem; margin-bottom:2.5rem; }
    .add-form h3 { font-family:'Bodoni Moda',serif; color:var(--gold); font-size:.9rem; letter-spacing:.08em; margin:0 0 .8rem; }
    .fg { display:flex; flex-direction:column; gap:.25rem; margin-bottom:.8rem; }
    .fg label { font-size:.7rem; color:var(--mist); text-transform:uppercase; letter-spacing:.06em; }
    .fg input, .fg textarea { background:#0d0908; border:1px solid #3a2a1a; color:var(--cream); padding:.45rem .7rem; border-radius:4px; font-family:inherit; font-size:.95rem; }
    .fg input:focus, .fg textarea:focus { outline:none; border-color:var(--gold); }
    .fg textarea { resize:vertical; min-height:70px; font-style:italic; }
    .save-btn { background:var(--gold); border:none; color:#0d0908; padding:.42rem 1.2rem; border-radius:4px; cursor:pointer; font-family:'Bodoni Moda',serif; letter-spacing:.06em; }
    .save-btn:hover { background:#e0bf60; }

    /* Vault list */
    .vault-label { font-family:'Bodoni Moda',serif; font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:#6a5040; margin-bottom:1rem; }
    .quote-card {
      background:#0f0a06; border:1px solid #1e1208; border-left:2px solid rgba(201,168,76,.35);
      border-radius:0 6px 6px 0; padding:1.1rem 1.4rem; margin-bottom:.8rem;
      position:relative; transition:border-color .2s;
    }
    .quote-card:hover { border-left-color:var(--gold); }
    .quote-text { font-style:italic; font-size:1.05rem; line-height:1.8; color:var(--cream); margin-bottom:.4rem; }
    .quote-source { font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--mist); opacity:.55; }
    .quote-del {
      position:absolute; top:.6rem; right:.7rem;
      background:none; border:none; color:#4a2a1a; cursor:pointer; font-size:.95rem;
      opacity:0; transition:opacity .15s;
    }
    .quote-card:hover .quote-del { opacity:1; }
    .quote-del:hover { color:#c41e3a; }
    .empty { text-align:center; padding:3rem 1rem; color:#4a3a2a; font-style:italic; }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="index.html">Bunny's World</a>
    <div class="nav-links">
      <a href="her-world.html">Her World</a>
      <a href="trackers.html">Trackers</a>
      <a href="cancer-corner.html">Cancer Corner</a>
      <a href="ginju.html">Ginju</a>
    </div>
  </nav>
  <div class="page-wrap">
    <h1>Quotes Vault</h1>
    <p class="subtitle">lines that lived in you — kept like pressed flowers ♦</p>

    <div class="qotd">
      <p class="qotd-label">Today's line</p>
      <p class="qotd-text" id="qotdText"><span class="qotd-empty">add your first quote below — one will live here each day</span></p>
      <p class="qotd-source" id="qotdSource"></p>
    </div>

    <div class="add-form">
      <h3>◆ Keep a Line</h3>
      <div class="fg">
        <label>The quote</label>
        <textarea id="qText" placeholder="write the line exactly as it found you…"></textarea>
      </div>
      <div class="fg">
        <label>Where it's from</label>
        <input type="text" id="qSource" placeholder="book · song · person · film…" maxlength="80" />
      </div>
      <button class="save-btn" id="addBtn">Keep it</button>
    </div>

    <p class="vault-label" id="vaultLabel">The Vault</p>
    <div id="vaultList"></div>
    <div class="empty" id="emptyState" style="display:none;">the vault is empty — keep your first line ↑</div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, onValue, push, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
    if (!sessionStorage.getItem('bw_unlocked')) location.replace('index.html');

    const CFG={apiKey:"AIzaSyAvEc04TFiGuYnDkgPQID9LFaU3Ot1dBnc",authDomain:"anna-birthday-site.firebaseapp.com",databaseURL:"https://anna-birthday-site-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"anna-birthday-site",storageBucket:"anna-birthday-site.firebasestorage.app",messagingSenderId:"972555476285",appId:"1:972555476285:web:5dfd0ac26dd7df9b9f7954"};
    const app=initializeApp(CFG); const db=getDatabase(app);
    const quotesRef=ref(db,'quotes');

    let quotes={};

    onValue(quotesRef,s=>{quotes=s.val()||{};render();});

    function render(){
      const keys=Object.keys(quotes);
      const list=document.getElementById('vaultList');
      const empty=document.getElementById('emptyState');
      document.getElementById('vaultLabel').textContent=`The Vault · ${keys.length} line${keys.length!==1?'s':''}`;
      list.innerHTML='';

      if(!keys.length){
        empty.style.display='block';
        document.getElementById('qotdText').innerHTML='<span class="qotd-empty">add your first quote below — one will live here each day</span>';
        document.getElementById('qotdSource').textContent='';
        return;
      }
      empty.style.display='none';

      // Quote of the day — deterministic by date, so it's stable all day
      const dayNum=Math.floor(Date.now()/86400000);
      const sorted=keys.sort();
      const pick=quotes[sorted[dayNum%sorted.length]];
      document.getElementById('qotdText').textContent='“'+pick.text+'”';
      document.getElementById('qotdSource').textContent=pick.source?'— '+pick.source:'';

      // newest first
      keys.sort((a,b)=>(quotes[b].ts||0)-(quotes[a].ts||0)).forEach(k=>{
        const q=quotes[k];
        const card=document.createElement('div');card.className='quote-card';
        card.innerHTML=`
          <p class="quote-text">“${q.text}”</p>
          <p class="quote-source">${q.source?'— '+q.source:''}</p>
          <button class="quote-del" title="Remove">×</button>`;
        card.querySelector('.quote-del').onclick=()=>{
          if(confirm('Let this line go?'))remove(ref(db,'quotes/'+k));
        };
        list.appendChild(card);
      });
    }

    document.getElementById('addBtn').onclick=()=>{
      const text=document.getElementById('qText').value.trim();
      const source=document.getElementById('qSource').value.trim();
      if(!text){alert('Write the quote first');return;}
      push(quotesRef,{text,source,ts:Date.now()});
      document.getElementById('qText').value='';
      document.getElementById('qSource').value='';
    };
  </script>
  <script type="module">
    import { initPlayer } from './js/player.js';
    initPlayer();
  </script>
  <script type="module">
    import { initScene } from './js/scene3d.js';
    initScene();
  </script>
  <script type="module">
    import { initPixelate } from './js/pixelate.js';
    initPixelate();
  </script>
</body>
</html>
