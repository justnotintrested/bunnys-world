<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Pixels — Bunny's World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pixel.css" />
  <style>
    :root { --ink:#0d0908; --gold:#c9a84c; --cream:#f0e8e0; --mist:#a08060; }
    body { background:var(--ink); color:var(--cream); font-family:'Cormorant Garamond',serif; min-height:100vh; }
    .page-wrap { max-width:760px; margin:0 auto; padding:2rem 1.5rem 5rem; }
    h1 { font-family:'Bodoni Moda',serif; font-size:2rem; color:var(--gold); margin-bottom:.15rem; }
    .subtitle { font-style:italic; color:var(--mist); margin-bottom:2rem; font-size:.95rem; }

    .month-nav { display:flex; gap:.5rem; align-items:center; margin-bottom:1.4rem; }
    .month-nav button { background:none; border:1px solid #3a2a1a; color:var(--gold); padding:.25rem .7rem; cursor:pointer; border-radius:3px; font-family:inherit; font-size:1rem; }
    .month-nav button:hover { border-color:var(--gold); }
    .month-label { font-family:'Bodoni Moda',serif; font-size:1.25rem; color:var(--cream); min-width:170px; text-align:center; }

    .cal-wrap { margin-bottom:1.6rem; }
    .cal-table { border-collapse:separate; border-spacing:5px; margin:0 auto; }
    .dow { font-size:.6rem; color:#6a5040; letter-spacing:.08em; text-transform:uppercase; text-align:center; padding-bottom:4px; }
    .px {
      width:56px; height:56px; border-radius:6px;
      background:#1a1208; border:1px solid #241710;
      cursor:pointer; position:relative;
      transition:transform .1s, box-shadow .1s;
    }
    .px:hover { transform:scale(1.08); box-shadow:0 0 10px rgba(201,168,76,.3); z-index:5; }
    .px .dnum { font-size:.62rem; color:#5a4636; padding:4px 0 0 6px; display:block; }
    .px .hrs { position:absolute; bottom:4px; right:6px; font-size:.6rem; color:rgba(240,232,224,.75); }
    .px.empty { background:transparent; border-color:transparent; cursor:default; }
    .px.empty:hover { transform:none; box-shadow:none; }
    .px.future { opacity:.3; cursor:default; }
    .px.future:hover { transform:none; box-shadow:none; }
    .px.today { box-shadow:0 0 0 1.5px var(--gold); }
    /* feel colours */
    .s-great { background:#1e5a56; border-color:#2a6a64; }
    .s-good  { background:#2a4a72; border-color:#36578a; }
    .s-okay  { background:#7a5c1e; border-color:#8a6a28; }
    .s-poor  { background:#6a2222; border-color:#7a2e2e; }
    .s-great .dnum,.s-good .dnum,.s-okay .dnum,.s-poor .dnum { color:rgba(240,232,224,.65); }

    .legend { display:flex; gap:1.3rem; flex-wrap:wrap; align-items:center; margin-bottom:2rem; justify-content:center; }
    .legend-item { display:flex; align-items:center; gap:.4rem; font-size:.78rem; color:var(--mist); }
    .ls { width:14px; height:14px; border-radius:4px; }

    .log-form { background:#110b07; border:1px solid #2a1a10; border-radius:8px; padding:1.2rem 1.5rem; margin-bottom:2rem; }
    .log-form h3 { font-family:'Bodoni Moda',serif; color:var(--gold); font-size:.9rem; letter-spacing:.08em; margin:0 0 .8rem; }
    .form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.8rem; margin-bottom:.8rem; }
    .fg { display:flex; flex-direction:column; gap:.25rem; }
    .fg label { font-size:.7rem; color:var(--mist); text-transform:uppercase; letter-spacing:.06em; }
    .fg input, .fg select, .fg textarea { background:#0d0908; border:1px solid #3a2a1a; color:var(--cream); padding:.38rem .65rem; border-radius:4px; font-family:inherit; font-size:.9rem; }
    .fg input:focus, .fg select:focus, .fg textarea:focus { outline:none; border-color:var(--gold); }
    .fg select option { background:#1a0f0a; }
    .fg textarea { resize:vertical; min-height:54px; }
    .save-btn { background:var(--gold); border:none; color:#0d0908; padding:.42rem 1.2rem; border-radius:4px; cursor:pointer; font-family:'Bodoni Moda',serif; letter-spacing:.06em; }
    .save-btn:hover { background:#e0bf60; }

    .stats { display:flex; gap:2rem; flex-wrap:wrap; padding:.9rem 1.2rem; background:#110b07; border:1px solid #2a1a10; border-radius:6px; }
    .stat { display:flex; flex-direction:column; gap:.15rem; }
    .stat-val { font-family:'Bodoni Moda',serif; font-size:1.5rem; color:var(--gold); }
    .stat-lbl { font-size:.68rem; color:#6a5040; text-transform:uppercase; letter-spacing:.08em; }

    .tooltip { position:fixed; background:#1a0f0a; border:1px solid #3a2a1a; color:var(--cream); padding:.4rem .7rem; border-radius:4px; font-size:.78rem; pointer-events:none; z-index:1000; display:none; line-height:1.5; max-width:230px; }

    @media(max-width:560px){
      .px { width:40px; height:40px; }
      .px .hrs { display:none; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="index.html">Bunny's World</a>
    <div class="nav-links">
      <a href="her-world.html">Her World</a>
      <a href="trackers.html">Trackers</a>
      <a href="cancer-corner.html">Cancer Corner</a>
      <a href="ginju.html">Ginju</a>
    </div>
  </nav>
  <div class="page-wrap">
    <h1>Sleep Pixels</h1>
    <p class="subtitle">one square per night — colour is how it felt ♦</p>

    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth">›</button>
    </div>

    <div class="cal-wrap">
      <table class="cal-table" id="calTable"></table>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="ls s-great"></div> Great</div>
      <div class="legend-item"><div class="ls s-good"></div> Good</div>
      <div class="legend-item"><div class="ls s-okay"></div> Okay</div>
      <div class="legend-item"><div class="ls s-poor"></div> Poor</div>
      <div class="legend-item" style="font-size:.72rem;color:#4a3a2a;font-style:italic;">click a day to log</div>
    </div>

    <div class="log-form">
      <h3 id="logTitle">◆ Log a Night</h3>
      <div class="form-row">
        <div class="fg"><label>Date</label><input type="date" id="logDate" /></div>
        <div class="fg"><label>Bedtime</label><input type="time" id="logBed" value="23:00" /></div>
        <div class="fg"><label>Woke up</label><input type="time" id="logWake" value="07:00" /></div>
        <div class="fg"><label>How it felt</label>
          <select id="logFeel">
            <option value="great">Great ✦</option>
            <option value="good" selected>Good</option>
            <option value="okay">Okay</option>
            <option value="poor">Poor</option>
          </select>
        </div>
      </div>
      <div class="fg" style="margin-bottom:.9rem;"><label>Note</label>
        <textarea id="logNote" placeholder="dreams, wake-ups, anything…"></textarea>
      </div>
      <button class="save-btn" id="saveBtn">Save Night</button>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-val" id="sNights">0</span><span class="stat-lbl">Nights logged</span></div>
      <div class="stat"><span class="stat-val" id="sAvg">—</span><span class="stat-lbl">Avg sleep</span></div>
      <div class="stat"><span class="stat-val" id="sGreat">0</span><span class="stat-lbl">Great nights</span></div>
      <div class="stat"><span class="stat-val" id="sBest">—</span><span class="stat-lbl">Longest sleep</span></div>
    </div>
  </div>
  <div class="tooltip" id="tooltip"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
    if (!sessionStorage.getItem('bw_unlocked')) location.replace('index.html');

    const CFG={apiKey:"AIzaSyAvEc04TFiGuYnDkgPQID9LFaU3Ot1dBnc",authDomain:"anna-birthday-site.firebaseapp.com",databaseURL:"https://anna-birthday-site-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"anna-birthday-site",storageBucket:"anna-birthday-site.firebasestorage.app",messagingSenderId:"972555476285",appId:"1:972555476285:web:5dfd0ac26dd7df9b9f7954"};
    const app=initializeApp(CFG); const db=getDatabase(app);

    const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const FEEL_LBL={great:'Great ✦',good:'Good',okay:'Okay',poor:'Poor'};

    const today=new Date();
    let curYear=today.getFullYear(), curMonth=today.getMonth(), allLogs={};
    const tooltip=document.getElementById('tooltip');
    document.getElementById('logDate').value=today.toISOString().slice(0,10);

    onValue(ref(db,'sleep_log'),s=>{allLogs=s.val()||{};render();});

    document.getElementById('prevMonth').onclick=()=>{curMonth--;if(curMonth<0){curMonth=11;curYear--;}render();};
    document.getElementById('nextMonth').onclick=()=>{curMonth++;if(curMonth>11){curMonth=0;curYear++;}render();};

    function ds(d){return `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
    function calcH(bed,wake){
      if(!bed||!wake)return 0;
      const [bh,bm]=bed.split(':').map(Number), [wh,wm]=wake.split(':').map(Number);
      let h=(wh+wm/60)-(bh+bm/60); if(h<=0)h+=24;
      return Math.round(h*10)/10;
    }

    function render(){
      document.getElementById('monthLabel').textContent=MONTHS[curMonth]+' '+curYear;
      const tbl=document.getElementById('calTable');tbl.innerHTML='';
      const hdr=document.createElement('tr');
      DOW.forEach(d=>{const th=document.createElement('th');th.className='dow';th.textContent=d;hdr.appendChild(th);});
      tbl.appendChild(hdr);

      const dim=new Date(curYear,curMonth+1,0).getDate();
      const firstDow=(new Date(curYear,curMonth,1).getDay()+6)%7; // Mon=0
      let tr=document.createElement('tr');
      for(let i=0;i<firstDow;i++){const td=document.createElement('td');const c=document.createElement('div');c.className='px empty';td.appendChild(c);tr.appendChild(td);}

      for(let d=1;d<=dim;d++){
        if((firstDow+d-1)%7===0&&d!==1){tbl.appendChild(tr);tr=document.createElement('tr');}
        const td=document.createElement('td');
        const cell=document.createElement('div');cell.className='px';
        const dateS=ds(d);
        const log=allLogs[dateS];
        const isFuture=new Date(curYear,curMonth,d)>today;
        const isToday=curYear===today.getFullYear()&&curMonth===today.getMonth()&&d===today.getDate();
        if(isToday)cell.classList.add('today');
        if(isFuture)cell.classList.add('future');
        else if(log&&log.feel)cell.classList.add('s-'+log.feel);

        cell.innerHTML=`<span class="dnum">${d}</span>`+(log&&log.hours&&!isFuture?`<span class="hrs">${log.hours}h</span>`:'');

        cell.addEventListener('mouseenter',ev=>{
          tooltip.style.display='block';
          tooltip.innerHTML=`<strong>${dateS}</strong>${log
            ?`<br>${FEEL_LBL[log.feel]||''}${log.hours?' · '+log.hours+'h':''}${log.bed?'<br>'+log.bed+' → '+(log.wake||'?'):''}${log.note?'<br><em>'+log.note+'</em>':''}`
            :(isFuture?'<br><em>future</em>':'<br><em>not logged</em>')}`;
          moveTip(ev);
        });
        cell.addEventListener('mousemove',moveTip);
        cell.addEventListener('mouseleave',()=>tooltip.style.display='none');
        if(!isFuture)cell.addEventListener('click',()=>{
          document.getElementById('logDate').value=dateS;
          document.getElementById('logTitle').textContent='◆ Log — '+dateS;
          if(log){
            if(log.bed)document.getElementById('logBed').value=log.bed;
            if(log.wake)document.getElementById('logWake').value=log.wake;
            document.getElementById('logFeel').value=log.feel||'good';
            document.getElementById('logNote').value=log.note||'';
          }
          document.querySelector('.log-form').scrollIntoView({behavior:'smooth',block:'nearest'});
        });
        td.appendChild(cell);tr.appendChild(td);
      }
      tbl.appendChild(tr);
      updateStats();
    }

    function moveTip(ev){tooltip.style.left=(ev.clientX+14)+'px';tooltip.style.top=(ev.clientY-38)+'px';}

    document.getElementById('saveBtn').onclick=()=>{
      const date=document.getElementById('logDate').value;if(!date){alert('Pick a date');return;}
      const bed=document.getElementById('logBed').value, wake=document.getElementById('logWake').value;
      const feel=document.getElementById('logFeel').value, note=document.getElementById('logNote').value.trim();
      const hours=calcH(bed,wake);
      const data={feel,note};if(bed)data.bed=bed;if(wake)data.wake=wake;if(hours)data.hours=hours;
      set(ref(db,'sleep_log/'+date),data);
      document.getElementById('logNote').value='';
      document.getElementById('logTitle').textContent='◆ Log a Night';
    };

    function updateStats(){
      const dim=new Date(curYear,curMonth+1,0).getDate();
      let n=0,total=0,great=0,best=0;
      for(let d=1;d<=dim;d++){
        const log=allLogs[ds(d)];if(!log)continue;
        n++;const h=parseFloat(log.hours||0);total+=h;if(h>best)best=h;
        if(log.feel==='great')great++;
      }
      document.getElementById('sNights').textContent=n;
      document.getElementById('sAvg').textContent=n&&total?(total/n).toFixed(1)+'h':'—';
      document.getElementById('sGreat').textContent=great;
      document.getElementById('sBest').textContent=best?best+'h':'—';
    }
  </script>
  <script type="module">
    import { initPlayer } from './js/player.js';
    initPlayer();
  </script>
  <script type="module">
    import { initScene } from './js/scene3d.js';
    initScene();
  </script>
  <script type="module">
    import { initPixelate } from './js/pixelate.js';
    initPixelate();
  </script>
</body>
</html>
