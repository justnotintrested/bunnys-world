<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Card — Bunny's World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pixel.css" />
  <style>
    :root { --ink:#0d0908; --gold:#c9a84c; --cream:#f0e8e0; --mist:#a08060; }
    body { color:var(--cream); font-family:'Cormorant Garamond',serif; min-height:100vh; }
    .page-wrap { max-width:560px; margin:0 auto; padding:2rem 1.5rem 5rem; text-align:center; }
    h1 { font-family:'Bodoni Moda',serif; font-size:2rem; color:var(--gold); margin-bottom:.15rem; }
    .subtitle { font-style:italic; color:var(--mist); margin-bottom:2.5rem; font-size:.95rem; }

    /* card */
    .card-stage { perspective:1200px; display:flex; justify-content:center; margin-bottom:2rem; }
    .card {
      width:min(280px, 78vw); aspect-ratio:5/8;
      position:relative; cursor:pointer;
      transform-style:preserve-3d;
      transition:transform 1.1s cubic-bezier(.4,.1,.2,1);
    }
    .card.flipped { transform:rotateY(180deg); cursor:default; }
    .card-face {
      position:absolute; inset:0; backface-visibility:hidden;
      border-radius:14px; overflow:hidden;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      border:1px solid rgba(201,168,76,.5);
    }
    /* back of card (shown first) */
    .card-back {
      background:
        radial-gradient(ellipse 60% 45% at 50% 50%, rgba(201,168,76,.12), transparent 70%),
        repeating-linear-gradient(45deg, #14100a 0 10px, #110d08 10px 20px);
    }
    .card-back .emblem {
      font-size:3rem; color:var(--gold); opacity:.7;
      text-shadow:0 0 30px rgba(201,168,76,.5);
      animation:glowPulse 2.5s ease-in-out infinite;
    }
    @keyframes glowPulse { 50% { text-shadow:0 0 50px rgba(201,168,76,.9); opacity:1; } }
    .card-back .hint { font-size:.62rem; letter-spacing:.25em; text-transform:uppercase; color:var(--mist); opacity:.5; margin-top:1.2rem; }
    .card-back .border-ring {
      position:absolute; inset:10px; border:1px solid rgba(201,168,76,.25); border-radius:9px;
      pointer-events:none;
    }
    /* front of card (revealed) */
    .card-front {
      transform:rotateY(180deg);
      background:
        radial-gradient(ellipse 80% 60% at 50% 15%, rgba(201,168,76,.14), transparent 60%),
        linear-gradient(170deg, #1a1208, #0f0a06);
      padding:1.6rem 1.4rem;
      justify-content:space-between;
    }
    .cf-roman { font-family:'Bodoni Moda',serif; font-size:.8rem; letter-spacing:.3em; color:var(--gold); opacity:.6; }
    .cf-symbol { font-size:3.2rem; margin:.6rem 0; text-shadow:0 0 24px rgba(201,168,76,.4); }
    .cf-title { font-family:'Bodoni Moda',serif; font-size:1.45rem; color:var(--gold); margin-bottom:.6rem; }
    .cf-text { font-style:italic; font-size:.95rem; line-height:1.75; color:var(--cream); opacity:.85; }
    .cf-foot { font-size:.58rem; letter-spacing:.25em; text-transform:uppercase; color:var(--mist); opacity:.4; }

    .pulled-note { font-size:.8rem; color:var(--mist); font-style:italic; opacity:.7; }
    .pulled-note strong { color:var(--gold); font-style:normal; }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="index.html">Bunny's World</a>
    <div class="nav-links">
      <a href="her-world.html">Her World</a>
      <a href="trackers.html">Trackers</a>
      <a href="cancer-corner.html">Cancer Corner</a>
      <a href="ginju.html">Ginju</a>
    </div>
  </nav>
  <div class="page-wrap">
    <h1>Daily Card</h1>
    <p class="subtitle">one card a day — the deck knows what you need ♦</p>

    <div class="card-stage">
      <div class="card" id="card">
        <div class="card-face card-back">
          <div class="border-ring"></div>
          <div class="emblem">☽</div>
          <div class="hint" id="hint">tap to pull</div>
        </div>
        <div class="card-face card-front">
          <div class="cf-roman" id="cfRoman"></div>
          <div>
            <div class="cf-symbol" id="cfSymbol"></div>
            <div class="cf-title" id="cfTitle"></div>
            <div class="cf-text" id="cfText"></div>
          </div>
          <div class="cf-foot">Bunny's World · Daily Pull</div>
        </div>
      </div>
    </div>

    <p class="pulled-note" id="pulledNote"></p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
    if (!sessionStorage.getItem('bw_unlocked')) location.replace('index.html');

    const CFG={apiKey:"AIzaSyAvEc04TFiGuYnDkgPQID9LFaU3Ot1dBnc",authDomain:"anna-birthday-site.firebaseapp.com",databaseURL:"https://anna-birthday-site-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"anna-birthday-site",storageBucket:"anna-birthday-site.firebasestorage.app",messagingSenderId:"972555476285",appId:"1:972555476285:web:5dfd0ac26dd7df9b9f7954"};
    const app=initializeApp(CFG); const db=getDatabase(app);

    const DECK=[
      {n:'I',    s:'🌙', t:'The Moon-Soft',   x:'Feel it all today. Your softness is not a flaw — it is the whole point of you.'},
      {n:'II',   s:'🐰', t:'The Bunny',       x:'Small, quick, alive. Today asks for tiny brave hops, not giant leaps.'},
      {n:'III',  s:'🦢', t:'The Swan',        x:'Grace is not the absence of effort. You make difficult things look gentle.'},
      {n:'IV',   s:'❤️', t:'The Tifosa',      x:'Loyal heart, racing blood. Back yourself the way you back your team — loudly.'},
      {n:'V',    s:'🕯️', t:'The Candle',     x:'You do not have to light every room. One warm corner is enough today.'},
      {n:'VI',   s:'🌹', t:'The Rose',        x:'Thorns are part of the design. Protect your softness without apologising.'},
      {n:'VII',  s:'🧵', t:'The Maker',       x:'NIFT hands, dreamer head. Make one small thing today — it counts.'},
      {n:'VIII', s:'🌊', t:'The Tide',        x:'Cancer moon, ocean child. Let today come in waves. You can float.'},
      {n:'IX',   s:'👑', t:'The Crown',       x:'Carry yourself like the answer is already yes.'},
      {n:'X',    s:'🍓', t:'The Sweet Thing', x:'Joy is not frivolous. Eat the good thing. Wear the good outfit. Today.'},
      {n:'XI',   s:'🪞', t:'The Mirror',      x:'The person looking back at you has survived 100% of her worst days.'},
      {n:'XII',  s:'🌿', t:'The Slow Growth', x:'Nothing blooming yet does not mean nothing growing. Roots first.'},
      {n:'XIII', s:'🔥', t:'The Ember',       x:'You are not burnt out. You are banked — saving heat for what matters.'},
      {n:'XIV',  s:'🩰', t:'The Soft Armour', x:'Dress like a poem today. Beauty is a kind of defiance.'},
      {n:'XV',   s:'🐈', t:'The Familiar',    x:'Ginju chose you. Animals know. Trust what loves you without words.'},
      {n:'XVI',  s:'⭐', t:'The North Star',  x:'You do not need the whole map. One true direction is enough.'},
      {n:'XVII', s:'🌧️', t:'The Rain',       x:'Let it pour. Rain is how the sky vents. Then everything smells new.'},
      {n:'XVIII',s:'🗝️', t:'The Key',        x:'The door you keep knocking on may open inward. Stop pushing. Pull.'},
      {n:'XIX',  s:'☀️', t:'The Golden Hour',x:'You are in your warm light era. Let yourself be seen in it.'},
      {n:'XX',   s:'📖', t:'The Unwritten',   x:'Today is a blank page, not a test. Scribble. Cross out. Begin again.'},
      {n:'XXI',  s:'🦋', t:'The Becoming',    x:'You are mid-metamorphosis. Of course it feels strange. Keep going.'},
      {n:'XXII', s:'💌', t:'The Letter',      x:'Someone thinks of you more often than you would ever guess. Believe it.'},
      {n:'XXIII',s:'🏁', t:'The Lights Out',  x:'Lights out and away we go. Whatever you have been waiting to start — today.'},
      {n:'XXIV', s:'🍷', t:'The Velvet',      x:'Slow evening energy. You are allowed to do absolutely nothing, beautifully.'},
      {n:'XXV',  s:'🌷', t:'The Tulip',       x:'Some flowers close at night to survive. Resting is not retreating.'},
    ];

    const today=new Date();
    const dateKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const card=document.getElementById('card');
    let flipped=false, todayCard=null;

    function showCard(idx, alreadyPulled){
      const c=DECK[idx];
      document.getElementById('cfRoman').textContent=c.n;
      document.getElementById('cfSymbol').textContent=c.s;
      document.getElementById('cfTitle').textContent=c.t;
      document.getElementById('cfText').textContent=c.x;
      if(alreadyPulled){
        card.classList.add('flipped');
        flipped=true;
        document.getElementById('pulledNote').innerHTML=`today's card is <strong>${c.t}</strong> — come back tomorrow for a new pull ☽`;
      }
    }

    // load today's pull if it exists
    const pullRef=ref(db,'card_pulls/'+dateKey);
    get(pullRef).then(snap=>{
      if(snap.exists()){
        todayCard=snap.val().idx;
        showCard(todayCard,true);
      }
    });

    card.addEventListener('click',()=>{
      if(flipped)return;
      if(todayCard===null){
        todayCard=Math.floor(Math.random()*DECK.length);
        set(pullRef,{idx:todayCard,ts:Date.now()});
      }
      showCard(todayCard,false);
      card.classList.add('flipped');
      flipped=true;
      const c=DECK[todayCard];
      document.getElementById('pulledNote').innerHTML=`today's card is <strong>${c.t}</strong> — come back tomorrow for a new pull ☽`;
    });
  </script>
  <script type="module">
    import { initPlayer } from './js/player.js';
    initPlayer();
  </script>
  <script type="module">
    import { initScene } from './js/scene3d.js';
    initScene();
  </script>
  <script type="module">
    import { initPixelate } from './js/pixelate.js';
    initPixelate();
  </script>
</body>
</html>
